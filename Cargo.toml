[package]
name = "mundi"
version = "0.14.0"
edition = "2024"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
libadwaita = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
gio = "0.22"
glib = { version = "0.22", features = ["log_macros"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
i18n-format = { version = "0.4", features = ["legacy"] }
anyhow = "1.0"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.41"

[build-dependencies]
glib-build-tools = "0.22"
regex = "1.11"
